  CognitoDomainUrl:
    Description: Cognito Hosted UI URL
    Value: !Sub "https://aria-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"

  TaskApiUrl:
    Description: Task Management API URL
    Value: !Sub "https://${TaskApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  TaskApiRestApiId:
    Description: Task Management API REST API ID (needed for Gateway setup)
    Value: !Ref TaskApi

  RuntimeRoleArn:
    Description: IAM role ARN for AgentCore Runtime
    Value: !GetAtt AriaRuntimeRole.Arn

  GatewayRoleArn:
    Description: IAM role ARN for AgentCore Gateway
    Value: !GetAtt AriaGatewayRole.Arn

  EvaluationRoleArn:
    Description: IAM role ARN for AgentCore Evaluations
    Value: !GetAtt AriaEvaluationRole.Arn

  S3BucketName:
    Description: S3 bucket for agent code artifacts
    Value: !Ref AriaAgentCodeBucket

  FrontendApiId:
    Description: Frontend API Gateway REST API ID
    Value: !Ref AriaFrontendApi

  FrontendApiUrl:
    Description: Frontend API Gateway URL
    Value: !Sub "https://${AriaFrontendApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  FrontendChatResourceId:
    Description: API Gateway resource ID for /chat (used by deploy script)
    Value: !Ref AriaChatResource

  CloudFrontUrl:
    Description: CloudFront distribution URL for the frontend
    Value: !Sub "https://${AriaDistribution.DomainName}"

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !Ref AriaDistribution

  FrontendBucketName:
    Description: S3 bucket for frontend files
    Value: !Ref AriaFrontendBucket

  Region:
    Description: AWS Region
    Value: !Ref AWS::Region
