[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-agentcore-workshop"
version = "1.0.0"
description = "Aria AI Assistant deployed on Amazon Bedrock AgentCore Runtime"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Vinicius Carida", email = "vfcarida@gmail.com" }
]
dependencies = [
    "boto3>=1.40.0",
    "botocore>=1.40.0",
    "bedrock-agentcore>=0.1.0",
    "strands-agents>=0.1.0",
    "strands-tools>=0.1.0",
    "opensearch-py>=2.4.0",
    "streamlit>=1.40.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "requests>=2.32.0",
    "pydantic>=2.10.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation>=0.50b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "moto>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "moto>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
